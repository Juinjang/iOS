name: Gemini Code Review

on:
  pull_request:
    branches:
      - develop
      - refactoring
    types:
      - opened
      - synchronize

jobs:
  review:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install GitHub CLI
        run: sudo apt-get install -y gh

      - name: Run Gemini Code Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |

          echo "Fetching base branch..."
          git fetch origin ${{ github.base_ref }}

          echo "Collecting PR diff..."
          DIFF=$(git diff origin/${{ github.base_ref }} | head -c 40000)

          if [ -z "$DIFF" ]; then
            echo "No diff found in PR."
            exit 0
          fi

          PROMPT=$(cat .ai/prompts/ios-review.md)

          echo "Preparing Gemini request..."

          JSON=$(jq -n \
            --arg prompt "$PROMPT" \
            --arg diff "$DIFF" \
            '{
              contents: [{
                role: "user",
                parts: [{
                  text: ($prompt + "\n\nReview the following Swift PR diff:\n" + $diff)
                }]
              }]
            }')

          echo "Calling Gemini API..."

          RESPONSE=$(curl -s \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$JSON")

          echo "===== GEMINI RESPONSE ====="
          echo "$RESPONSE"
          echo "==========================="

          COMMENT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text' 2>/dev/null)

          if [ -z "$COMMENT" ] || [ "$COMMENT" = "null" ]; then
            COMMENT="Gemini did not generate a review. Check Action logs for the API response."
          fi

          echo "Posting review comment..."

          gh pr comment ${{ github.event.pull_request.number }} \
            --body "$(printf "## 🤖 Gemini Code Review\n\n%s" "$COMMENT")"
