name: Gemini Code Review

on:
  pull_request:
    branches:
      - develop
      - refactoring
    types:
      - opened
      - synchronize

jobs:
  review:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run Gemini Code Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}

          echo "Fetching base branch..."
          git fetch origin ${{ github.base_ref }}

          echo "Collecting PR diff..."
          DIFF=$(git diff origin/${{ github.base_ref }} | head -c 40000)

          if [ -z "$DIFF" ]; then
            echo "No diff found in PR."
            exit 0
          fi

          PROMPT=$(cat .ai/prompts/ios-review.md)

          echo "Preparing Gemini request..."

          JSON=$(jq -n \
            --arg prompt "$PROMPT" \
            --arg diff "$DIFF" \
            '{
              contents: [{
                role: "user",
                parts: [{
                  text: ($prompt + "\n\nReview the following Swift PR diff:\n" + $diff)
                }]
              }]
            }')

          echo "Calling Gemini API..."

          RESPONSE=$(curl -s \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$JSON")

          REVIEW=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text' 2>/dev/null)

          if [ -z "$REVIEW" ] || [ "$REVIEW" = "null" ]; then
            REVIEW="Gemini API 응답을 받지 못했습니다. Actions 로그를 확인해주세요."
            echo "===== GEMINI RESPONSE ====="
            echo "$RESPONSE"
            echo "==========================="
          fi

          BODY=$(printf "## 🤖 AI Code Review Bot\n\n%s\n\n---\n_Last updated: $(date -u '+%Y-%m-%d %H:%M UTC') | Powered by Gemini_" "$REVIEW")

          echo "Checking for existing review comment..."

          EXISTING_COMMENT_ID=$(gh api \
            "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | startswith("## 🤖 AI Code Review Bot")) | .id' \
            | head -1)

          if [ -n "$EXISTING_COMMENT_ID" ]; then
            echo "Updating existing comment (ID: $EXISTING_COMMENT_ID)..."
            gh api \
              --method PATCH \
              "repos/${{ github.repository }}/issues/comments/${EXISTING_COMMENT_ID}" \
              -f body="$BODY"
          else
            echo "Creating new review comment..."
            gh pr comment ${PR_NUMBER} --body "$BODY"
          fi

          echo "Done!"
