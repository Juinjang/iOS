name: AI Code Review

on:
  pull_request:
    branches:
      - develop
      - refactoring
    types:
      - opened
      - synchronize

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  review:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run AI Code Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          EVENT_ACTION=${{ github.event.action }}

          echo "Fetching base branch..."
          git fetch origin ${{ github.base_ref }}

          # 최초 PR: 전체 diff / 이후 커밋: 해당 커밋 변경분만
          if [ "$EVENT_ACTION" = "opened" ]; then
            echo "New PR — reviewing full diff..."
            DIFF=$(git diff origin/${{ github.base_ref }} | head -c 40000)
            REVIEW_MODE="full"
          else
            echo "New commit — reviewing latest changes..."
            DIFF=$(git diff HEAD~1 | head -c 40000)
            REVIEW_MODE="incremental"
          fi

          if [ -z "$DIFF" ]; then
            echo "No diff found."
            exit 0
          fi

          PROMPT=$(cat .ai/prompts/ios-review.md)

          if [ "$REVIEW_MODE" = "incremental" ]; then
            EXTRA_INSTRUCTION="이전 리뷰에 추가하는 내용입니다. 이번 커밋의 변경사항만 리뷰해주세요. '추가 리뷰'라고 표시해주세요."
          else
            EXTRA_INSTRUCTION=""
          fi

          JSON=$(jq -n \
            --arg prompt "$PROMPT" \
            --arg diff "$DIFF" \
            --arg extra "$EXTRA_INSTRUCTION" \
            '{
              contents: [{
                role: "user",
                parts: [{
                  text: ($prompt + "\n\n" + $extra + "\n\nReview the following Swift PR diff:\n" + $diff)
                }]
              }]
            }')

          echo "Calling Gemini API..."

          RESPONSE=$(curl -s \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$JSON")

          REVIEW=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text' 2>/dev/null)

          if [ -z "$REVIEW" ] || [ "$REVIEW" = "null" ]; then
            REVIEW="Gemini API 응답을 받지 못했습니다. Actions 로그를 확인해주세요."
            echo "===== GEMINI RESPONSE ====="
            echo "$RESPONSE"
            echo "==========================="
          fi

          TIMESTAMP=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')

          # 템플릿 로드 및 변수 치환
          INITIAL_TEMPLATE=$(cat .ai/templates/review-initial.md)
          INCREMENTAL_TEMPLATE=$(cat .ai/templates/review-incremental.md)

          echo "Checking for existing review comment..."

          EXISTING_COMMENT_ID=$(gh api \
            "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | startswith("## 🤖 AI Code Review Bot")) | .id' \
            | head -1)

          if [ "$REVIEW_MODE" = "incremental" ] && [ -n "$EXISTING_COMMENT_ID" ]; then
            echo "Appending incremental review..."
            EXISTING_BODY=$(gh api \
              "repos/${{ github.repository }}/issues/comments/${EXISTING_COMMENT_ID}" \
              --jq '.body')

            APPEND_BODY="${INCREMENTAL_TEMPLATE//__TIMESTAMP_VALUE__/$TIMESTAMP}"
            APPEND_BODY="${APPEND_BODY//__REVIEW_CONTENT__/$REVIEW}"
            NEW_BODY="${EXISTING_BODY}${APPEND_BODY}"

            gh api \
              --method PATCH \
              "repos/${{ github.repository }}/issues/comments/${EXISTING_COMMENT_ID}" \
              -f body="$NEW_BODY"
          elif [ -n "$EXISTING_COMMENT_ID" ]; then
            echo "Updating existing comment..."
            BODY="${INITIAL_TEMPLATE//__TIMESTAMP_VALUE__/$TIMESTAMP}"
            BODY="${BODY//__REVIEW_CONTENT__/$REVIEW}"
            gh api \
              --method PATCH \
              "repos/${{ github.repository }}/issues/comments/${EXISTING_COMMENT_ID}" \
              -f body="$BODY"
          else
            echo "Creating new review comment..."
            BODY="${INITIAL_TEMPLATE//__TIMESTAMP_VALUE__/$TIMESTAMP}"
            BODY="${BODY//__REVIEW_CONTENT__/$REVIEW}"
            gh pr comment ${PR_NUMBER} --body "$BODY"
          fi

          echo "Done!"
