name: AI Code Review

on:
  pull_request:
    branches:
      - develop
      - refactoring
    types:
      - opened
      - synchronize

jobs:
  review:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run AI Code Review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}

          echo "Fetching base branch..."
          git fetch origin ${{ github.base_ref }}

          echo "Collecting PR diff..."
          DIFF=$(git diff origin/${{ github.base_ref }} | head -c 40000)

          if [ -z "$DIFF" ]; then
            echo "No diff found in PR."
            exit 0
          fi

          PROMPT=$(cat .ai/prompts/ios-review.md)

          echo "Preparing OpenAI request..."

          JSON=$(jq -n \
            --arg prompt "$PROMPT" \
            --arg diff "$DIFF" \
            '{
              model: "gpt-4o",
              messages: [
                {
                  role: "system",
                  content: $prompt
                },
                {
                  role: "user",
                  content: ("Review the following Swift PR diff:\n\n" + $diff)
                }
              ],
              temperature: 0.3
            }')

          echo "Calling OpenAI API..."

          RESPONSE=$(curl -s \
            -X POST \
            "https://api.openai.com/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "$JSON")

          REVIEW=$(echo "$RESPONSE" | jq -r '.choices[0].message.content' 2>/dev/null)

          if [ -z "$REVIEW" ] || [ "$REVIEW" = "null" ]; then
            REVIEW="OpenAI API 응답을 받지 못했습니다. Actions 로그를 확인해주세요."
            echo "===== OPENAI RESPONSE ====="
            echo "$RESPONSE"
            echo "==========================="
          fi

          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          BODY="## 🤖 AI Code Review Bot

${REVIEW}

---
_Last updated: ${TIMESTAMP} | Powered by GPT-4o_"

          echo "Checking for existing review comment..."

          EXISTING_COMMENT_ID=$(gh api \
            "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | startswith("## 🤖 AI Code Review Bot")) | .id' \
            | head -1)

          if [ -n "$EXISTING_COMMENT_ID" ]; then
            echo "Updating existing comment (ID: $EXISTING_COMMENT_ID)..."
            gh api \
              --method PATCH \
              "repos/${{ github.repository }}/issues/comments/${EXISTING_COMMENT_ID}" \
              -f body="$BODY"
          else
            echo "Creating new review comment..."
            gh pr comment ${PR_NUMBER} --body "$BODY"
          fi

          echo "Done!"
